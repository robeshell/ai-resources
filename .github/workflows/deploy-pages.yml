name: Deploy AI Resources to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      # 不在这里跑 curator:export。.curator/content.sqlite 是本地文件且被
      # gitignore，CI 里不存在，导出会从 data/tools.json 冷启动重建一个只有
      # 工具的库，然后清空 content/skills 与 content/projects 再按空列表重写
      # —— 线上会丢掉所有技能和项目正文页。这些派生文件已经提交进仓库，
      # CI 直接用即可。
      - name: Check and build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run lint
          npm run build
          rm -rf out/curator
          touch out/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
